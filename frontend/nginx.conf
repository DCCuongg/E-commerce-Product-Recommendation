server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/auth/ {
    proxy_pass http://auth-service:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  
  # Đặt TRƯỚC rule /api/v1/(products|...)
  location ~ ^/api/v1/products/[^/]+/frequently-bought-together {
    proxy_pass http://recommender-service:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~ ^/api/v1/(products|cart|orders|payments) {
    proxy_pass http://order-service:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/v1/recommendations {
    proxy_pass http://recommender-service:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/LogInteractionFunction {
    proxy_pass http://faas-logger:7071;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}