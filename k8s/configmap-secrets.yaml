apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce-rec
data:
  AUTH_SERVICE_URL: "http://auth-service:8001"
  ORDER_SERVICE_URL: "http://order-service:8002"
  RECOMMENDER_SERVICE_URL: "http://recommender-service:8003"
  POSTGRES_HOST: "ecommerce-pg-server.postgres.database.azure.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ecommerce_shop_db"
  POSTGRES_USER: "postgres_admin"
  POSTGRES_SSL_MODE: "require"
  COSMOS_DB_DATABASE_NAME: "ecommerce_recommender_db"
  COSMOS_CONTAINER_USER_RECS: "user_recommendations"
  COSMOS_CONTAINER_ITEM_RECS: "item_recommendations"
  COSMOS_CONTAINER_METADATA: "system_metadata"
  BLOB_CONTAINER_MODEL_ARTIFACTS: "model-artifacts"
  BLOB_CONTAINER_INTERACTION_LOGS: "interaction-logs"
  JWT_ALGORITHM: "HS256"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-rec
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<REPLACE_WITH_AZURE_POSTGRES_PASSWORD>"
  JWT_SECRET_KEY: "<REPLACE_WITH_PRODUCTION_JWT_SECRET>"
  COSMOS_DB_ENDPOINT: "https://<YOUR_COSMOS_ACCOUNT>.documents.azure.com:443/"
  COSMOS_DB_PRIMARY_KEY: "<REPLACE_WITH_COSMOS_PRIMARY_KEY>"
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=<YOUR_STORAGE_ACCOUNT>;AccountKey=<YOUR_STORAGE_KEY>;EndpointSuffix=core.windows.net"