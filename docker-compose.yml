services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_shop_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourSecurePasswordHere123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql/01_init_auth_db.sql:/docker-entrypoint-initdb.d/01_init_auth_db.sql:ro
      - ./scripts/sql/02_init_order_db.sql:/docker-entrypoint-initdb.d/02_init_order_db.sql:ro
      - ./scripts/sql/03_seed_auth.sql:/docker-entrypoint-initdb.d/03_seed_auth.sql:ro
      - ./scripts/sql/seed_products.sql:/docker-entrypoint-initdb.d/04_seed_products.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_admin} -d ${POSTGRES_DB:-ecommerce_shop_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_net

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: ecommerce_azurite_dev
    restart: always
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    networks:
      - ecommerce_net

  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: ecommerce_cosmos_dev
    restart: always
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 5
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    ports:
      - "8081:8081"
    volumes:
      - cosmos_data:/tmp/cosmos/appdata
    networks:
      - ecommerce_net

  auth-service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    container_name: ecommerce_auth_service
    restart: on-failure
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_shop_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourSecurePasswordHere123!}
      POSTGRES_SSL_MODE: disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ecommerce-recommender-super-secret-jwt-key-2026}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_net

  order-service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile
    container_name: ecommerce_order_service
    restart: on-failure
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_shop_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourSecurePasswordHere123!}
      POSTGRES_SSL_MODE: disable
      AUTH_SERVICE_URL: http://auth-service:8001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ecommerce-recommender-super-secret-jwt-key-2026}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - ecommerce_net

  recommender-service:
    build:
      context: .
      dockerfile: services/recommender_service/Dockerfile
    container_name: ecommerce_recommender_service
    restart: on-failure
    environment:
      DEPLOYMENT_SLOT: blue
      MODEL_VERSION: v1.0-svd
      COSMOS_DB_ENDPOINT: http://cosmos-emulator:8081/
      COSMOS_DB_PRIMARY_KEY: ${COSMOS_DB_PRIMARY_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}
      COSMOS_DB_DATABASE_NAME: ${COSMOS_DB_DATABASE_NAME:-ecommerce_recommender_db}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "8003:8003"
    depends_on:
      - azurite
      - cosmos-emulator
    networks:
      - ecommerce_net

  faas-logger:
    build:
      context: .
      dockerfile: azure_functions/Dockerfile
    container_name: ecommerce_faas_logger
    restart: on-failure
    environment:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      BLOB_CONTAINER_INTERACTION_LOGS: interaction-logs
    ports:
      - "7071:7071"
    depends_on:
      - azurite
    networks:
      - ecommerce_net

  frontend:
    profiles: [ "fe" ]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    restart: on-failure
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - order-service
      - recommender-service
      - faas-logger
    networks:
      - ecommerce_net

volumes:
  postgres_data:
  azurite_data:
  cosmos_data:


networks:
  ecommerce_net:
    driver: bridge
