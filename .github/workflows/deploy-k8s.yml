name: CI/CD Backend Microservices (Auto CI & Manual AKS Blue/Green)

on:
  push:
    branches: ["main"]
    paths:
      - "services/**"
      - "ml_pipeline/**"
      - "azure_functions/**"
      - "k8s/**"
      - ".github/workflows/deploy-k8s.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_slot:
        description: "Slot deploy trên AKS (blue hoặc green)"
        required: true
        default: "blue"
        type: choice
        options:
          - blue
          - green
      switch_traffic:
        description: "Chuyển traffic sang slot này ngay sau khi deploy?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================================
  # GIAI ĐOẠN 1: CI (TỰ ĐỘNG CHẠY KHI PUSH / PR - KHÔNG CẦN AZURE SECRETS)
  # ============================================================================
  ci-verify:
    name: CI - Kiểm tra Code, Test & Build Docker thử
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt Dependencies & Kiểm tra Syntax/Import
        run: |
          python -m pip install --upgrade pip
          pip install -r services/auth_service/requirements.txt
          pip install -r services/order_service/requirements.txt
          pip install -r services/recommender_service/requirements.txt
          pip install pytest httpx
          python -m compileall services ml_pipeline azure_functions
          PYTHONPATH=. python -c "from services.auth_service.main import app; from services.order_service.main import app; from services.recommender_service.main import app; print('All FastAPI services verified OK')"

      - name: Chạy Pytest (nếu có thư mục tests/)
        run: |
          if [ -d "tests" ] && ls tests/*.py 1> /dev/null 2>&1; then
            PYTHONPATH=. pytest -v
          else
            echo "Chưa có file test trong tests/, bỏ qua bước pytest."
          fi

      - name: Build thử Docker Image (Không Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/recommender_service/Dockerfile
          push: false
          tags: ecommerce-recommender:ci-check

  # ============================================================================
  # GIAI ĐOẠN 2: CD (CHỈ CHẠY KHI BẠN BẤM NÚT "RUN WORKFLOW" BẰNG TAY)
  # ============================================================================
  cd-deploy-aks:
    name: CD - Deploy thủ công lên Azure AKS
    needs: ci-verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Container Registry (ACR / Docker Hub)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth_service
          file: ./services/auth_service/Dockerfile
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY }}/ecommerce-auth:${{ env.IMAGE_TAG }}

      - name: Build & Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order_service
          file: ./services/order_service/Dockerfile
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY }}/ecommerce-order:${{ env.IMAGE_TAG }}

      - name: Build & Push Recommender Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/recommender_service/Dockerfile
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY }}/ecommerce-recommender:${{ env.IMAGE_TAG }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy Manifests lên AKS (Slot ${{ inputs.target_slot }})
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          TARGET_SLOT: ${{ inputs.target_slot }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap-secrets.yaml
          envsubst < k8s/auth-service-deploy.yaml | kubectl apply -f -
          envsubst < k8s/order-service-deploy.yaml | kubectl apply -f -
          envsubst < k8s/recommender-${TARGET_SLOT}.yaml | kubectl apply -f -
          kubectl apply -f k8s/recommender-service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Xác nhận Rollout & Điều hướng Blue/Green
        env:
          TARGET_SLOT: ${{ inputs.target_slot }}
          SWITCH_TRAFFIC: ${{ inputs.switch_traffic }}
        run: |
          kubectl rollout status deployment/auth-service -n ecommerce-rec --timeout=120s
          kubectl rollout status deployment/order-service -n ecommerce-rec --timeout=120s
          kubectl rollout status deployment/recommender-deployment-${TARGET_SLOT} -n ecommerce-rec --timeout=120s
          if [ "${SWITCH_TRAFFIC}" = "true" ]; then
            kubectl patch service recommender-service -n ecommerce-rec -p "{\"spec\":{\"selector\":{\"app\":\"recommender\",\"version\":\"${TARGET_SLOT}\"}}}"
            echo "Active traffic routed to slot: ${TARGET_SLOT}"
          else
            echo "Slot ${TARGET_SLOT} deployed successfully. Traffic kept on existing slot."
          fi